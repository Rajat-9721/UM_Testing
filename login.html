<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Utkarsh Minds</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .login-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 40px;
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-gray);
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: white;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.875rem;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header" id="main-header" style="position: static; background: var(--bg-dark);">
    <div class="container">
      <a href="/" class="logo">
        Utkarsh <span>Minds</span>
      </a>
    </div>
  </header>

  <div class="container">
    <div class="login-container">
      <div class="login-header">
        <h2>Welcome Back</h2>
        <p style="color: var(--text-gray); margin-top: 8px;">Login to access your dashboard</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-accent btn-login" id="loginBtn">Login</button>
        <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>
      </form>
    </div>
  </div>

  <script src="supabaseClient.js"></script>
  <script src="auth-helpers.js"></script>
  <script>
    // Check if already logged in (role comes from profiles.role, not
    // user_metadata — see auth-helpers.js)
    async function checkAuth() {
      const { session, role } = await getTrustedSession(supabaseClient);
      if (session) {
        window.location.href = role === 'assistant' ? './assistant-dashboard.html' : './student-dashboard.html';
      }
    }
    checkAuth();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');

      console.log('Attempting login for:', email);
      loginBtn.textContent = 'Logging in...';
      loginBtn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        console.log('Supabase Auth Response:', { data, error });

        if (error) {
          console.error('Login error:', error);
          errorMsg.textContent = error.message === 'Email not confirmed'
            ? 'Email not confirmed. Ask the assistant to confirm this account in Supabase Auth, or disable email confirmation for temporary student accounts.'
            : error.message;
          errorMsg.style.display = 'block';
          loginBtn.textContent = 'Login';
          loginBtn.disabled = false;
        } else {
          // Trusted role check — reads profiles.role, not user_metadata
          const { role } = await getTrustedSession(supabaseClient);
          console.log('Login successful. Role:', role);
          if (role === 'assistant') {
            window.location.href = './assistant-dashboard.html';
          } else {
            window.location.href = './student-dashboard.html';
          }
        }
      } catch (err) {
        console.error('Unexpected Javascript Error during login:', err);
        errorMsg.textContent = 'An unexpected error occurred: ' + err.message;
        errorMsg.style.display = 'block';
        loginBtn.textContent = 'Login';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
